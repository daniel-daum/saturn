# deploys the site to cloudflare pages on every push to main. copies every
# tracked file except the ones that never go live (see the grep below).
# needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Stage public files
              run: |
                  set -euo pipefail
                  mkdir dist
                  git ls-files -z \
                      | grep -zv -e '^internal/' -e '^scripts/' -e '^social/' -e '^\.gitea/' -e '^\.gitignore$' -e '^mise\.toml$' \
                      | xargs -0 cp --parents -t dist

            # from social/ so wrangler finds its functions and wrangler.toml
            - name: Deploy to Cloudflare Pages
              working-directory: social
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_SEND_METRICS: "false"
              run: npx --yes wrangler@4 pages deploy ../dist --project-name=saturn --branch=main
