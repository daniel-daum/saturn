name: Mirror and Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    mirror:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Push to GitHub
              run: |
                  git remote add github https://x-access-token:${{ secrets.GH_MIRROR_TOKEN }}@github.com/daniel-daum/saturn.git
                  git push github main --force
                  git push github --tags --force

    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Stage public files
              run: |
                  mkdir dist
                  git ls-files -z \
                      | grep -zv -e '^internal/' -e '^workers/' -e '^\.gitea/' -e '^\.gitignore$' -e '^mise\.toml$' \
                      | xargs -0 cp --parents -t dist

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name=saturn --branch=main
