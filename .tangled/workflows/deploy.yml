# deploys the site to cloudflare pages on every push to main. copies every
# tracked file except the ones that never go live (see the grep below).
# needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets

when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: "nixery"

# wrangler comes from npm at deploy time: the nixpkgs package makes a huge
# image that nixery is slow to build
dependencies:
  nixpkgs:
    - gnugrep
    - findutils
    - nodejs

environment:
  WRANGLER_SEND_METRICS: "false"

steps:
  - name: "Stage public files"
    command: |
      set -euo pipefail
      mkdir dist
      git ls-files -z \
          | grep -zv -e '^internal/' -e '^scripts/' -e '^social/' -e '^\.tangled/' -e '^\.gitignore$' -e '^mise\.toml$' \
          | xargs -0 cp --parents -t dist

  # from social/ so wrangler finds its functions and wrangler.toml
  - name: "Deploy to Cloudflare Pages"
    command: |
      set -euo pipefail
      cd social
      npx --yes wrangler@4 pages deploy ../dist --project-name=saturn --branch=main
