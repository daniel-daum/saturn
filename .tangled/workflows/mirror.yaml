# mirrors main to github and gitea on every push. tangled is the source of
# truth, so both get force-pushed to match it. needs the GH_MIRROR_TOKEN and
# GITEA_MIRROR_TOKEN secrets

when:
    - event: ["push", "manual"]
      branch: ["main"]

engine: "nixery"

steps:
    # spindle clones one commit deep (depth: 0 means 1 too), and the mirrors
    # need the whole history. this also points origin/main at the newest main,
    # so a late or retried run never rolls the mirrors back
    - name: "Fetch full history"
      command: |
          set -euo pipefail
          git fetch --unshallow origin

    - name: "Mirror to GitHub"
      command: |
          set -euo pipefail
          git push --force "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/daniel-daum/saturn.git" refs/remotes/origin/main:refs/heads/main

    - name: "Mirror to Gitea"
      command: |
        set -euo pipefail
  
        # ssh refuses to run without a passwd entry, and nixery images have none
        mkdir -p /etc
        [ -e /etc/passwd ] || echo "root:x:0:0:root:${HOME}:/bin/bash" > /etc/passwd
  
        mkdir -p "${HOME}/.ssh"
        printf '%s\n' "${GITEA_MIRROR_KEY}" > "${HOME}/.ssh/gitea"
        chmod 600 "${HOME}/.ssh/gitea"
        ssh-keyscan -p 2222 git-ssh.danieldaum.net > "${HOME}/.ssh/known_hosts"
  
        export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/gitea -o IdentitiesOnly=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
        git push --force "ssh://git@git-ssh.danieldaum.net:2222/daniel-daum/${TANGLED_REPO_NAME}.git" refs/remotes/origin/main:refs/heads/main
