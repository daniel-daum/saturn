# copies my bluesky posts and recent project commits into the html,
# publishes my writing to standard.site, then commits and pushes the result
# back here, which runs deploy and mirror. runs once an hour. to run it now,
# open the latest sync pipeline and hit retry.
# needs the ATPROTO_APP_PASSWORD and TANGLED_PUSH_KEY secrets

when:
  - event: ["schedule"]
    schedule:
      - cron: "H * * * *"
  - event: ["manual"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nodejs
    - openssh

steps:
  # a scheduled run starts from whatever main was when spindle last looked,
  # so catch up before changing anything
  - name: "Check out the newest main"
    command: |
      set -euo pipefail
      git fetch origin main
      git checkout -B main FETCH_HEAD

  - name: "Sync posts"
    command: node scripts/sync-posts.mjs

  - name: "Sync commits"
    command: node scripts/sync-commits.mjs

  - name: "Publish to standard.site"
    command: node scripts/sync-standard.mjs

  - name: "Commit and push"
    command: |
      set -euo pipefail
      if git diff --quiet; then
          echo "nothing changed"
          exit 0
      fi

      # ssh refuses to run without a passwd entry, and nixery images have none
      mkdir -p /etc
      [ -e /etc/passwd ] || echo "root:x:0:0:root:${HOME}:/bin/bash" > /etc/passwd

      mkdir -p "${HOME}/.ssh"
      printf '%s\n' "${TANGLED_PUSH_KEY}" > "${HOME}/.ssh/tangled"
      chmod 600 "${HOME}/.ssh/tangled"
      ssh-keyscan tangled.org > "${HOME}/.ssh/known_hosts"

      git config user.name "daniel daum"
      git config user.email "daniel@danieldaum.net"
      git commit -am "chore: sync"

      export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/tangled -o IdentitiesOnly=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
      git push git@tangled.org:danieldaum.net/saturn HEAD:refs/heads/main
