# .tangled/workflows/mirror-to-github.yml

when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 0

dependencies:
  nixpkgs:
    - git

steps:
  - name: "Mirror to GitHub"
    command: |
      git fetch --unshallow origin || true
      git fetch origin refs/heads/main:refs/heads/main
      git remote add github https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_USERNAME}/${GITHUB_REPO_NAME}.git
      git push github refs/heads/main:refs/heads/main --force
    environment:
      GITHUB_USERNAME: "daniel-daum"
      GITHUB_REPO_NAME: "saturn"

  - name: "Mirror to Gitea"
    command: |
      git fetch --unshallow origin || true
      git fetch origin refs/heads/main:refs/heads/main
      git remote add gitea https://${GITEA_USERNAME}:${GITEA_TOKEN}@${GITEA_HOST}/${GITEA_USERNAME}/${GITEA_REPO_NAME}.git
      git push gitea refs/heads/main:refs/heads/main --force
    environment:
      GITEA_USERNAME: "daniel-daum"
      GITEA_REPO_NAME: "saturn"
      GITEA_HOST: "git.danieldaum.net"
